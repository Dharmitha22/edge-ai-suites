# Smart Classroom — containerized stack (Linux)
#
# Skeleton phase: the `app` service (React SPA + FastAPI /health skeleton) and
# the `metrics-collector` telemetry sidecar (live CPU/GPU/NPU/memory/power for
# the Resource Utilization dashboard, built from the vendored
# performance-tools/ submodule) are active and started by default, so the
# dashboard always has live values as soon as a session starts — no separate
# profile flag needed. The OVMS, model-downloader, and content-search services
# below are still scaffolded as commented placeholders — uncomment and
# complete each one as its image is built.
#
# See docs/phase-0-containerization-plan.md for the full target topology.
#
# Usage:
#   git submodule update --init            # first time only (performance-tools + audio-analyzer)
#   docker compose up -d --build          # CPU-only, UI skeleton + dashboard
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Then open http://localhost:8000/ and curl http://localhost:9100/metrics

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        # Forward the host proxy (if any) so npm/pip can fetch packages.
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: smart-classroom-app:local
    container_name: smart-classroom-app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [smart-classroom]
    depends_on:
      audio-analyzer: { condition: service_started }
      metrics-collector: { condition: service_healthy }
    environment:
      - METRICS_COLLECTOR_URL=http://metrics-collector:9000
      - AUDIO_ANALYZER_URL=http://audio-analyzer:8010
    # When the rest of the real backend is layered in (main.py instead of
    # skeleton_server.py: OVMS, content-search), extend the block above:
    # depends_on:
    #   ovms: { condition: service_healthy }
    #   content-search: { condition: service_healthy }
    #   metrics-collector: { condition: service_healthy }
    # environment:
    #   - SERVING_BASE_URL=http://ovms:9000
    #   - CONTENT_SEARCH_HOST=content-search
    #   - METRICS_COLLECTOR_URL=http://metrics-collector:9000
    # volumes:
    #   - storage:/app/storage
    #   - model-cache:/app/models:ro

  metrics-collector:   # telemetry sidecar: CPU/GPU/NPU/memory/power -> /metrics, /platform-info
    build:
      context: performance-tools
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-metrics-collector:local
    container_name: sc-metrics-collector
    # privileged + host /proc,/sys are required by sar/free/qmassa/PCM inside
    # the performance-tools image; this does not require network_mode: host,
    # so the container stays reachable at the DNS name "metrics-collector"
    # from the app service on the bridge network below.
    privileged: true
    environment:
      - RESULTS_DIR=/tmp/results
      - NPU_LOG=/tmp/results/npu_usage.csv
      - METRICS_HTTP_PORT=9000
    volumes:
      - metrics:/tmp/results
      - /sys:/sys:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/class/drm:/sys/class/drm:ro
    ports:
      # Host-published so `curl http://localhost:9100/metrics` works for
      # manual verification without exec-ing into the container.
      - "9100:9000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [smart-classroom]

  audio-analyzer:      # ASR / transcription microservice (:8010, internal only)
    # Vendored as a git submodule (edge-ai-libraries/microservices/audio-analyzer).
    # The Smart Classroom backend uploads recorded audio here and streams back
    # per-chunk transcription; no ASR model is loaded in the app process.
    build:
      context: ./edge-ai-libraries/microservices/audio-analyzer
      dockerfile: docker/Dockerfile
      args:
        # Defaults to true because the committed audio-analyzer config.yaml
        # selects provider: funasr (paraformer-zh); a false build would crash
        # at startup. Override with INSTALL_CJK=false only alongside a Whisper
        # provider in that config.
        INSTALL_CJK: "${INSTALL_CJK:-true}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: smart-classroom-audio-analyzer:local
    container_name: sc-audio-analyzer
    user: "1000:1000"
    environment:
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # ZE_ENABLE_ALT_DRIVERS is required for Intel NPU enumeration (GPU override).
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      # HF_TOKEN is only needed when the service runs diarization (gated models).
      HF_TOKEN: "${HF_TOKEN:-}"
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    volumes:
      # Editable service config (ASR provider/model/device, diarization).
      - ./edge-ai-libraries/microservices/audio-analyzer/config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio-analyzer-models:/app/audio_analyzer/models
      - audio-analyzer-chunks:/app/audio_analyzer/chunks
      - audio-analyzer-storage:/app/audio_analyzer/storage
      - audio-analyzer-cache:/app/audio_analyzer/.cache
    healthcheck:
      # The port only binds after startup preloads models. First run downloads
      # them (FunASR paraformer-zh ~900MB + VAD/punc, or Whisper) which, on a
      # slow/proxied network, can take far longer than a Whisper GPU warmup —
      # so start_period must cover that one-time download or the container is
      # wrongly flagged unhealthy before it ever serves. Models persist to the
      # audio-analyzer-models volume, so subsequent starts are fast.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      start_period: 1800s
      retries: 5
    restart: unless-stopped
    networks: [smart-classroom]

  # ===========================================================================
  # SKELETON PLACEHOLDERS — not yet built. Uncomment + complete per component.
  # ===========================================================================

