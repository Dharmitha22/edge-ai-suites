  # ovms:               # OpenVINO Model Server (:9000, internal only)
  #   image: openvino/model_server:2026.3
  #   command: >-
  #     --rest_port 9000 --config_path /models/ovms/config.json
  #   volumes:
  #     - model-cache:/models:ro
  #   depends_on:
  #     model-downloader: { condition: service_completed_successfully }
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/v2/health/ready"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #   restart: unless-stopped
  #   networks: [smart-classroom]

  # content-search:     # RAG / multimodal backend (:9011, internal only)
  #   build:
  #     context: .
  #     dockerfile: docker/content-search.Dockerfile
  #   depends_on:
  #     ovms: { condition: service_healthy }
  #   restart: unless-stopped
  #   networks: [smart-classroom]

networks:
  smart-classroom:
    driver: bridge

volumes:
  model-cache:
  storage:
  metrics:
